[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-tools"
version = "0.1.0"
description = "A local toolkit for working through a thesis: topic/title selection with novelty checking, and a local library indexer for downloaded papers."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "pypdf>=4.0",
    "python-docx>=1.0",
    # Reading the dashcam frames `detect-signs` works on: the local prefilter
    # and the thumbnails in its report both go through Pillow.
    "pillow>=9.0",
    # Claude-drafted summaries, sub-question suggestions, stance analysis, and
    # literature-review prose are on by default whenever ANTHROPIC_API_KEY is
    # present — install it unconditionally rather than as an opt-in extra.
    "anthropic>=0.30",
    # urllib3 2.x prints a NotOpenSSLWarning on every run under a Python built
    # against LibreSSL instead of OpenSSL (common on macOS system/Homebrew
    # Python). urllib3 1.x has no such check and works identically here.
    "urllib3<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
thesis-tools = "thesis_tools.cli:main"

[tool.setuptools]
packages = ["thesis_tools", "thesis_tools.sources", "thesis_tools.library", "thesis_tools.signs"]
